name: Deploy (Workers SSR)

# Replaces the old Cloudflare Pages deploy. The frontend is now a React Router
# framework-mode app served from a Cloudflare Worker (`slashr-ssr`).
#
# At the prod flip: rename the worker to `slashr` (wrangler.jsonc) + attach the
# slashr.dev custom domain to it, and set the API secrets so loaders hit
# api.slashr.dev directly instead of the public slashr.dev/api double-hop.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: workers-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy -c build/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
