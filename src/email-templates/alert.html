<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slashr Alert</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0a0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #0a0a0b;">
    <tr>
      <td align="center" style="padding: 40px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%;">

          <!-- Header -->
          <tr>
            <td style="padding: 20px 24px; background-color: #111113; border-bottom: 1px solid rgba(255,255,255,0.06);">
              <span style="font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.87); letter-spacing: -0.02em;">&#9889; Slashr Alert</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 32px 24px; background-color: #111113;">
              <!-- Validator + chain -->
              <p style="margin: 0 0 4px; font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.87); line-height: 1.3;">
                {{VALIDATOR_NAME}}
              </p>
              <p style="margin: 0 0 20px; font-size: 13px; color: rgba(255,255,255,0.50);">
                on {{CHAIN_NAME}}
              </p>

              <!-- Event details -->
              <p style="margin: 0 0 6px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.70);">
                {{EVENT_DESCRIPTION}}
              </p>
              <p style="margin: 0 0 20px; font-size: 13px; color: rgba(255,255,255,0.40);">
                Detected {{EVENT_TIMESTAMP}}
              </p>

              <!-- Stake context (optional) -->
              {{#IF_STAKE_CONTEXT}}
              <p style="margin: 0 0 20px; font-size: 13px; color: rgba(255,255,255,0.50);">
                {{STAKE_CONTEXT}}
              </p>
              {{/IF_STAKE_CONTEXT}}

              <!-- CTA Button (table-based for Outlook) -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 24px 0;">
                <tr>
                  <td style="border-radius: 4px; background-color: rgba(255,255,255,0.87);">
                    <a href="{{VALIDATOR_URL}}" target="_blank" style="display: inline-block; padding: 12px 28px; font-size: 13px; font-weight: 600; font-family: 'Courier New', monospace; color: #0a0a0b; text-decoration: none; letter-spacing: 0.03em;">
                      View Details &rarr;
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 16px 24px; background-color: #111113; border-top: 1px solid rgba(255,255,255,0.06);">
              <p style="margin: 0 0 8px; font-size: 11px; line-height: 1.5; color: rgba(255,255,255,0.30);">
                You subscribed to alerts for {{TARGET_DESCRIPTION}}.
              </p>
              <p style="margin: 0; font-size: 11px; color: rgba(255,255,255,0.25);">
                <a href="{{MANAGE_URL}}" style="color: rgba(255,255,255,0.35); text-decoration: underline;">Manage alerts</a>
                &nbsp;&middot;&nbsp;
                <a href="{{UNSUBSCRIBE_URL}}" style="color: rgba(255,255,255,0.35); text-decoration: underline;">Unsubscribe</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
